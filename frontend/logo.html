<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slopify logo preview</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f0e8;
        color: #17151d;
        font-family: system-ui, sans-serif;
      }
      main { width: min(880px, calc(100% - 48px)); }
      h1 { margin: 0 0 32px; font-size: 20px; }
      .sizes {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 40px;
      }
      figure { margin: 0; text-align: center; }
      img { display: block; object-fit: contain; }
      figcaption { margin-top: 12px; font: 12px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>Slopify — pink and purple mark</h1>
      <div class="sizes">
        <figure>
          <img src="public/logo.png" width="320" height="320" alt="Slopify logo" />
          <figcaption>320px</figcaption>
        </figure>
        <figure>
          <img src="public/logo.png" width="120" height="120" alt="" />
          <figcaption>120px</figcaption>
        </figure>
        <figure>
          <img src="public/logo.png" width="48" height="48" alt="" />
          <figcaption>48px</figcaption>
        </figure>
        <figure>
          <img src="public/logo.png" width="24" height="24" alt="" />
          <figcaption>24px</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
