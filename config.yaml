# ---------------------------------------------------------------
# bad-spotify: the agent that plays the worst possible music
# ---------------------------------------------------------------

capture:
  source: replay          # replay | video | webcam | glasses
  frame_interval_s: 5.0
  audio_window_s: 3.0
  replay_dir: data/replay/park_afternoon

  # source: video -- a recording pretending to be live. This is the demo path.
  video_path:             # or pass --video path/to/clip.mp4
  realtime: false         # true = pace it at the video's real speed
  loop: false

gate:
  # Only escalate to the expensive model when the world actually changed.
  frame_diff_threshold: 0.18     # mean abs pixel delta, normalised 0-1
  audio_rms_delta: 0.12
  onset_spike_ratio: 1.8         # onset rate vs rolling median
  force_escalate_after_s: 45     # never go fully blind

perceive:
  backend: mock           # mock | gemini
  model: gemini-2.5-flash
  timeout_s: 4.0          # give up after this and reuse the last read
  retries: 1              # ...after retrying once

antagonize:
  # There is no "how far to go" dial. The agent always fully inverts the mood;
  # how wrong the result turned out is measured afterwards, not requested.
  strategies:             # these fan out in parallel
    - genre_antipode
    - tempo_clash
    - lyrical_irony
  candidates_per_strategy: 4

judge:
  backend: mock           # mock | gemini
  model: gemini-2.5-flash
  timeout_s: 4.0          # give up after this and use the geometric top pick
  retries: 1

dj:
  cooldown_seconds: 8           # hard floor between any two actions
  agreement_reads: 2            # hysteresis: N consecutive agreeing scene reads
  max_consecutive_failures: 3

  # Queue or interrupt? Queueing is the default and is nearly always allowed
  # -- it doesn't disturb what's playing. Cutting the music off has to be
  # earned: the scene must have moved at least this far, AND the current
  # track must have had a fair run.
  interrupt_threshold: 0.55     # how far the world must move (0-2ish)
  min_interrupt_seconds: 15     # a track is safe from being cut for this long
  min_track_seconds: 25         # ...and only interruptible after this

player:
  backend: mock           # mock | local | spotify
  local_library: data/library
  volume: 0.7

  # Spotify only. Requires Premium -- the API refuses playback on free accounts.
  # Run `python scripts/spotify_setup.py` once before using this.
  play_mode: queue        # default when the DJ has no opinion
  skip_to_queued: false   # true = queue then immediately skip into it
  device_name:            # e.g. "Alex's MacBook Pro" -- blank picks the active one
  market: from_token

voice:
  backend: mock           # mock | elevenlabs
  duck_to: 0.25           # duck music to this while narrating
  max_quip_chars: 120

  # What it says out loud. Same sentence every time, and SINCERE: the agent
  # believes it read the room correctly and is pleased with its choice. It
  # never winks. The line claims the song fits; the audience notices it
  # doesn't. Placeholders: {title} {artist} {context} {mood} {quip}
  #
  # Alternates that keep the character:
  #   "Now playing {title} by {artist}, to suit the mood."
  #   "For your {context}, I've chosen {title} by {artist}. It fits."
  #   "{context} calls for {title} by {artist}."
  #
  # Set to "" to speak the judge's quip instead.
  line: "Now playing {title} by {artist} — the perfect fit for your {context}."

  # Which ElevenLabs voice. Env ELEVENLABS_VOICE_ID wins over this.
  # `python scripts/voice_lines.py --list` prints what your account has;
  # `--audition` renders the same line in several so you can pick by ear.
  voice_id:

hud:
  enabled: true
  host: 127.0.0.1
  port: 8420
