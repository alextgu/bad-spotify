# ---------------------------------------------------------------
# bad-spotify: the agent that plays the worst possible music
# ---------------------------------------------------------------

capture:
  source: replay          # replay | video | webcam | glasses
  # The reaction budget, end to end:
  #   up to frame_interval_s waiting for the next sample
  # + ~1.2s  perception (measured median, gemini-3.5-flash-lite)
  # + local inversion + five local strategies; catalogue discovery is optional
  # At the old 5.0 the sampling wait DOMINATED -- a hard cut could take 6.2s to
  # answer, which reads as lag. At 2.0 the worst case is ~3.2s and the typical
  # case ~2.2s. This does not cost 2.5x the model calls: the change gate below
  # only escalates when the frame actually moved, and the DJ deadband drops
  # what survives that.
  frame_interval_s: 2.0
  audio_window_s: 3.0
  replay_dir: data/replay/park_afternoon

  # source: video -- a recording pretending to be live. This is the demo path.
  video_path:             # or pass --video path/to/clip.mp4
  realtime: false         # true = pace it at the video's real speed
  loop: false

gate:
  # Only escalate to the expensive model when the world actually changed.
  frame_diff_threshold: 0.18     # mean abs pixel delta, normalised 0-1
  audio_rms_delta: 0.12
  onset_spike_ratio: 1.8         # onset rate vs rolling median
  force_escalate_after_s: 45     # never go fully blind

perceive:
  backend: gemini         #Choose huggingface, mock, or gemini
  model: openai/clip-vit-base-patch32   # used by the huggingface backend
  # Measured 14 Aug against the live API, 3 calls each, same frame and prompt:
  #   gemini-2.5-flash                     4937 ms median  (thinking on)
  #   gemini-2.5-flash  thinking_budget=0  1572 ms
  #   gemini-3.5-flash-lite                1168 ms  <- and the MOST specific
  #   gemini-flash-lite-latest             1262 ms
  # gemini-2.5-flash-lite is retired (404). -lite rejects thinking_budget=0
  # and does not need it. Pinned rather than -latest: an alias that moves the
  # night before a demo is not a feature.
  gemini_model: gemini-3.5-flash-lite   # used by the gemini backend
  device: -1              #Negative one uses the CPU
  # Was 4.0, which was below the 5-8s the old model actually took -- every call
  # timed out and fell back to a canned read, silently. Median is now 1.17s.
  timeout_s: 3.0          # give up after this and reuse the last read
  retries: 1              # ...after retrying once

antagonize:
  # There is no "how far to go" dial. The agent always fully inverts the mood;
  # how wrong the result turned out is measured afterwards, not requested.
  strategies:             # these fan out in parallel
    - genre_antipode
    - tempo_clash
    - lyrical_irony
    # Inverts setting traits, then selects locally from the associated genre.
    # Candidate generation makes no Spotify request.
    - semantic_opposite
    # Wrong about the OCCASION rather than the sound. Reads
    # `SceneRead.references` -- the event and register, never the people.
    - register_clash
    # The only one not limited to the 47 hand-picked tracks: searches the live
    # Spotify catalogue for whatever the antivibe is hunting for. Needs
    # credentials; silently contributes nothing without them. This is what
    # stops a long session repeating itself.
    - catalogue_dive
  candidates_per_strategy: 4

judge:
  backend: mock           # mock | gemini
  model: gemini-2.5-flash
  timeout_s: 4.0          # give up after this and use local score sampling
  retries: 1
  # Softmax is applied to candidate scores after mood inference.
  selection_temperature: 0.20
  shortlist_size: 8

analysis:
  mood_change_threshold: 0.35   #Vibe distance needed for a new mood
  crossfade_seconds: 2.0        #Transition time after a mood change

dj:
  cooldown_seconds: 8           # hard floor between any two actions
  agreement_reads: 2            # hysteresis: N consecutive agreeing scene reads
  max_consecutive_failures: 3

  # --- when to reconsider at all -------------------------------------------
  # Measured against the real corpus on 14 Aug. Random jitter on a scene moves
  # the music target by up to ~0.23 and flips the top pick 37% of the time;
  # the SMALLEST genuine scene change moves it 0.56 (median 0.84). The gap
  # between those two numbers is where the deadband belongs.
  hold_threshold: 0.30          # below this the current track is still right
  # Set to the smallest genuine scene change in the measurement. It was 0.85,
  # which sat ABOVE the median real change (0.84) -- so most true changes fell
  # into the slow band and waited out the dwell floor for nothing.
  jump_threshold: 0.55          # above this, act on ONE read -- don't be late
  min_change_seconds: 20        # floor between two tracks; a jump bypasses it
  min_confidence: 0.35          # below this the system does nothing

  # Queue or interrupt? Queueing is the default and is nearly always allowed
  # -- it doesn't disturb what's playing. Cutting the music off has to be
  # earned: the scene must have moved at least this far, AND the current
  # track must have had a fair run.
  interrupt_threshold: 0.55     # how far the world must move (0-2ish)
  min_interrupt_seconds: 15     # a track is safe from being cut for this long
  min_track_seconds: 25         # ...and only interruptible after this

player:
  # Proven 14 Aug: setup ran end to end against a real Premium account,
  # 46/47 tracks resolved, and Sandstorm came out of a real speaker.
  # `app.py` is unaffected -- it forces the mock unless you pass --play, so a
  # hosted surface still never makes noise on its own.
  backend: spotify        # mock | local | spotify
  local_library: data/library
  volume: 0.7

  # Spotify only. Requires Premium -- the API refuses playback on free accounts.
  # Run `python scripts/spotify_setup.py` once before using this.
  play_mode: queue        # default when the DJ has no opinion
  skip_to_queued: false   # true = queue then immediately skip into it
  device_name:            # e.g. "Alex's MacBook Pro" -- blank picks the active one
  market: from_token

voice:
  backend: mock           # mock | elevenlabs
  duck_to: 0.25           # duck music to this while narrating
  max_quip_chars: 120

  # WHEN it speaks. Decided 14 Aug: the running product says one line, at
  # startup, and then shuts up.
  #   greeting     the startup line only. Default.
  #   every_track  narrate every song too. Costs a call per decision and
  #                fights the music -- the screens already show the reasoning.
  #   off          silent
  say: greeting

  # The project's name. NOT CHOSEN YET -- blank falls back to "DJ", and the
  # greeting still reads correctly. This is the one string to fill in when the
  # name is picked; the site's recorded clips need re-rendering after.
  agent_name:
  greeting: "Hello. I'm your {name}. I'll help you choose the perfect music for any moment."

  # What it says out loud. Same sentence every time, and SINCERE: the agent
  # believes it read the room correctly and is pleased with its choice. It
  # never winks. The line claims the song fits; the audience notices it
  # doesn't. Placeholders: {title} {artist} {context} {mood} {quip}
  #
  # Alternates that keep the character:
  #   "Now playing {title} by {artist}, to suit the mood."
  #   "For your {context}, I've chosen {title} by {artist}. It fits."
  #   "{context} calls for {title} by {artist}."
  #
  # Set to "" to speak the judge's quip instead.
  line: "Now playing {title} by {artist} — the perfect fit for your {context}."

  # Which ElevenLabs voice. Env ELEVENLABS_VOICE_ID wins over this.
  # `python scripts/voice_lines.py --list` prints what your account has;
  # `--audition` renders the same line in several so you can pick by ear.
  #
  # Nelson. Chosen 14 Aug — NOT yet heard saying one of our lines, because no
  # ELEVENLABS_API_KEY has existed on any machine that ran this. Before the
  # demo, run --audition and confirm it sounds like it MEANS the line: the
  # agent is sincerely pleased with its choice, and any irony in the delivery
  # kills the character.
  voice_id: 6OzrBCQf8cjERkYgzSg8

hud:
  enabled: true
  host: 127.0.0.1
  port: 8420
